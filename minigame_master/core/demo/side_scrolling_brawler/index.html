<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoreWeaver Side Scrolling Brawler Demo</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08111f; font-family: Arial, sans-serif; }
    #game-container { width: 100vw; height: 100vh; }
    #lw-demo-controls { position: fixed; right: 18px; bottom: 18px; z-index: 20; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; max-width: min(680px, calc(100vw - 36px)); }
    #lw-demo-controls button { min-width: 104px; height: 42px; padding: 0 14px; border: 1px solid #34d399; background: #064e3b; color: #ecfdf5; font-size: 15px; font-weight: 700; cursor: pointer; }
    #lw-demo-controls button[hidden] { display: none; }
    #lw-help { position: fixed; left: 16px; bottom: 16px; z-index: 19; margin: 0; padding: 8px 10px; background: rgba(2,6,23,.72); color: #a7f3d0; font-size: 12px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <p id="lw-help">WASD move · J/Space light · K heavy · tap lower screen to attack</p>
  <div id="lw-demo-controls">
    <button id="lw-start" data-testid="start-run">Start</button>
    <button id="lw-retreat" data-testid="retreat-run" hidden>Retreat</button>
    <button id="lw-pause" data-testid="pause-run" hidden>Pause</button>
    <button id="lw-restart" data-testid="restart-run" hidden>Restart</button>
    <button id="lw-back" data-testid="back-menu" hidden>Back</button>
  </div>
  <pre id="lw-test-state" data-testid="test-state" hidden>{}</pre>
  <script type="module" src="./main.js"></script>
</body>
</html>

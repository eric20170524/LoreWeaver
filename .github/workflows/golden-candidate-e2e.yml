name: Golden Candidate E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "backend/**"
      - "productize/**"
      - "minigame_master/**"
      - "vite.config.standalone.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/golden-candidate-e2e.yml"
  workflow_dispatch:

jobs:
  golden-candidate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair Rollup native optional dependency
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and verify golden candidate
        run: node productize/jobs/run-golden-candidate-e2e.mjs

      - name: Verify generic current-workspace Candidate path
        run: node productize/jobs/verify-workspace-candidate.mjs --workspace-id=__golden_survivor_vertical_slice_ci

      - name: Prove seeded adapter-state replay across two Candidate builds
        run: node productize/jobs/run-golden-cross-build-determinism.mjs

      - name: Prove VibeGame-aligned action boss runtime in real Chromium
        run: node productize/jobs/run-action-boss-alignment-e2e.mjs

      - name: Prove observed evidence recorder rejects synthetic sessions
        run: |
          cat > .golden-synthetic-human-observation.json <<'JSON'
          {
            "kind": "human_playtest",
            "humanObserved": true,
            "fixture": false,
            "synthetic": true,
            "sessions": [
              {
                "sessionId": "ci-synthetic-must-reject",
                "completed": true,
                "understoodCoreLoop": true,
                "wouldReplay": true,
                "completionSeconds": 1,
                "understandingSeconds": 1,
                "difficulty": 3,
                "fun": 3,
                "clarity": 3,
                "blockingIssues": [],
                "failureReasons": [],
                "suggestions": []
              }
            ]
          }
          JSON
          set +e
          OUTPUT="$(npx tsx productize/record-observed-release-evidence.ts \
            --workspace=data/workspaces/__golden_survivor_vertical_slice_ci \
            --kind=human \
            --input=.golden-synthetic-human-observation.json 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          rm -f .golden-synthetic-human-observation.json
          test "$CODE" -ne 0
          printf '%s\n' "$OUTPUT" | grep 'observation_input_rejected'
          printf '%s\n' "$OUTPUT" | grep 'synthetic_evidence_forbidden'
          test ! -f data/workspaces/__golden_survivor_vertical_slice_ci/reports/human_playtest_survivor_horde_latest.json

      - name: Audit exact candidate screenshot with generic real VLM path when available
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_VLM_MODEL: ${{ vars.XAI_VLM_MODEL }}
        run: python3 productize/jobs/run-workspace-vlm-audit.py --workspace-id=__golden_survivor_vertical_slice_ci --allow-unavailable

      - name: Upload golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-candidate-evidence
          if-no-files-found: ignore
          path: |
            data/workspaces/__golden_survivor_vertical_slice_ci/reports/**
            productize/exports/standalone-__golden_survivor_vertical_slice_ci-*/release-manifest.json
            productize/exports/standalone-__golden_survivor_vertical_slice_ci-*/RELEASE_STATUS.json

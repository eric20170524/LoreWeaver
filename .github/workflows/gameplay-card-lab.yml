name: Gameplay Card Lab
on:
  pull_request:
    paths:
      - 'productize/card-lab/**'
      - 'productize/jobs/*card-lab*'
      - 'productize/jobs/check-*-runtime.mjs'
      - 'productize/jobs/check-iframe-rewards.ts'
      - 'minigame_master/gameplay/cards/**'
      - 'minigame_master/core/**'
      - 'src/game/**'
      - 'src/runtime/**'
      - 'src/utils/**'
      - 'package*.json'
      - '.github/workflows/gameplay-card-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cards-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - card: dodge_counter_boss
            unit: check-dodge-counter-runtime.mjs
            browser: run-card-lab-e2e.mjs
          - card: rhythm_timing
            unit: check-rhythm-timing-runtime.mjs
            browser: run-rhythm-card-lab-e2e.mjs
          - card: drag_collect_grid
            unit: check-collect-dodge-runtime.mjs
            browser: run-collect-card-lab-e2e.mjs
          - card: sequence_synthesis
            unit: check-sequence-synthesis-runtime.mjs
            browser: run-sequence-card-lab-e2e.mjs
          - card: turn_based_skill_battle
            unit: check-turn-based-skill-battle-runtime.mjs
            browser: run-tbsb-card-lab-e2e.mjs
          - card: side_scrolling_brawler
            unit: check-side-scrolling-brawler-runtime.mjs
            browser: run-brawler-card-lab-e2e.mjs
          - card: survivor_horde
            unit: check-survivor-combat-runtime.mjs
            browser: run-survivor-card-lab-e2e.mjs
          - card: reaction_pick
            unit: check-reaction-pick-runtime.mjs
            browser: run-reaction-card-lab-e2e.mjs
          - card: energy_balance
            unit: check-energy-balance-runtime.mjs
            browser: run-energy-card-lab-e2e.mjs
          - card: observe_capture
            unit: check-observe-capture-runtime.mjs
            browser: run-observe-card-lab-e2e.mjs
          - card: drag_to_core
            unit: check-drag-core-runtime.mjs
            browser: run-drag-core-card-lab-e2e.mjs
          - card: pressure_survival
            unit: check-pressure-runtime.mjs
            browser: run-pressure-card-lab-e2e.mjs
          - card: rune_connect_sequence
            unit: check-rune-runtime.mjs
            browser: run-rune-card-lab-e2e.mjs
          - card: branching_dialogue_check
            unit: check-dialogue-runtime.mjs
            browser: run-dialogue-card-lab-e2e.mjs
          - card: shooter_duel
            unit: check-shooter-runtime.mjs
            browser: run-shooter-card-lab-e2e.mjs
          - card: maze_exploration_choice
            unit: check-maze-runtime.mjs
            browser: run-maze-card-lab-e2e.mjs
          - card: platform_escape
            unit: check-platform-runtime.mjs
            browser: run-platform-card-lab-e2e.mjs
          - card: hazard_collect_waves
            unit: check-hazard-waves-runtime.mjs
            browser: run-hazard-waves-card-lab-e2e.mjs
          - card: sequence_puzzle_combo
            unit: check-combo-runtime.mjs
            browser: run-combo-card-lab-e2e.mjs
          - card: rhythm_then_pickup
            unit: check-rhythm-pickup-runtime.mjs
            browser: run-rhythm-pickup-card-lab-e2e.mjs
          - card: qix_area_capture
            unit: check-qix-runtime.mjs
            browser: run-qix-card-lab-e2e.mjs
          - card: point_drag_progression
            unit: check-point-drag-runtime.mjs
            browser: run-point-drag-card-lab-e2e.mjs
          - card: node_iframe_microgame
            unit: check-iframe-runtime.mjs
            browser: run-iframe-card-lab-e2e.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Card state-machine regressions
        run: node --test productize/jobs/${{ matrix.unit }}
      - name: Iframe reward persistence regressions
        if: matrix.card == 'node_iframe_microgame'
        run: node --import tsx --test productize/jobs/check-iframe-rewards.ts
      - name: Install real Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium
      - name: Real browser input on the shared static bundle
        timeout-minutes: 10
        run: node productize/jobs/${{ matrix.browser }}
      - name: Upload tested playable bundle (this card's scope only)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: card-lab-playable-${{ matrix.card }}
          path: dist/card-lab/
          if-no-files-found: error
      - name: Upload scoped browser evidence and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-lab-evidence-${{ matrix.card }}
          path: workflow/reports/card-lab/
          if-no-files-found: error
